<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papers</title>
  <style>
    :root {
      --paper-bg: #f6f3ed;
      --paper-surface: #ffffff;
      --paper-ink: #1f2528;
      --paper-muted: #65716f;
      --paper-line: #d9ded8;
      --paper-accent: #0f766e;
      --paper-accent-strong: #0b4f4a;
      --paper-shadow: 0 18px 45px rgba(31, 37, 40, 0.12);
    }

    body {
      margin: 0;
      background: var(--paper-bg);
      color: var(--paper-ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .paper-page {
      min-height: 100vh;
      padding: 32px;
    }

    .paper-shell {
      max-width: 1360px;
      margin: 0 auto;
    }

    .paper-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .paper-header h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 4.25rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .paper-header p {
      max-width: 560px;
      margin: 0;
      color: var(--paper-muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    .paper-layout {
      display: grid;
      grid-template-columns: minmax(260px, 380px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .paper-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      gap: 14px;
    }

    .paper-card {
      display: grid;
      grid-template-rows: 1fr auto;
      width: 100%;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--paper-line);
      border-radius: 8px;
      background: var(--paper-surface);
      box-sizing: border-box;
      box-shadow: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .paper-card:hover,
    .paper-card:focus-visible {
      border-color: var(--paper-accent);
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.18);
      outline: none;
      transform: translateY(-2px);
    }

    .paper-card[aria-current="true"] {
      border-color: var(--paper-accent-strong);
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.18);
    }

    .paper-thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #e9eee9;
    }

    .paper-thumb object,
    .paper-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
      pointer-events: none;
    }

    .paper-thumb-fallback {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 16px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #f8faf8 0%, #dbe8e5 100%);
      color: var(--paper-accent-strong);
      font-size: 0.8rem;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      text-transform: uppercase;
    }

    .paper-card-info {
      min-width: 0;
      padding: 12px;
    }

    .paper-card-title {
      display: -webkit-box;
      margin: 0 0 6px;
      overflow: hidden;
      color: var(--paper-ink);
      font-size: 0.95rem;
      font-weight: 750;
      line-height: 1.25;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .paper-card-meta {
      margin: 0;
      overflow: hidden;
      color: var(--paper-muted);
      font-size: 0.78rem;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader {
      overflow: hidden;
      border: 1px solid var(--paper-line);
      border-radius: 8px;
      background: var(--paper-surface);
      box-shadow: var(--paper-shadow);
    }

    .reader-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--paper-line);
      background: rgba(255, 255, 255, 0.9);
    }

    .reader-title {
      min-width: 0;
    }

    .reader-title h2 {
      margin: 0 0 4px;
      overflow: hidden;
      font-size: 1rem;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-title p {
      margin: 0;
      color: var(--paper-muted);
      font-size: 0.82rem;
    }

    .reader-open {
      flex: 0 0 auto;
      border: 1px solid var(--paper-accent);
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--paper-accent);
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
    }

    .reader-open:hover,
    .reader-open:focus-visible {
      background: var(--paper-accent-strong);
      border-color: var(--paper-accent-strong);
      outline: none;
    }

    .reader-frame {
      display: block;
      width: 100%;
      height: min(78vh, 920px);
      min-height: 620px;
      border: 0;
      background: #f2f4f2;
    }

    .empty-state {
      display: grid;
      min-height: 420px;
      place-items: center;
      padding: 32px;
      color: var(--paper-muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .paper-page {
        padding: 20px;
      }

      .paper-header {
        display: block;
      }

      .paper-header h1 {
        margin-bottom: 12px;
      }

      .paper-layout {
        grid-template-columns: 1fr;
      }

      .paper-grid {
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      }

      .reader-frame {
        height: 72vh;
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <main class="paper-page">
    <div class="paper-shell">
      <header class="paper-header">
        <h1>Papers</h1>
        <p>Select a paper from the grid to read the full PDF. Add more entries in the papers list inside this HTML file as you place PDFs in the repository.</p>
      </header>

      <section class="paper-layout" aria-label="Paper reader">
        <nav class="paper-grid" id="paperGrid" aria-label="Available papers"></nav>

        <article class="reader" aria-live="polite">
          <div class="reader-toolbar">
            <div class="reader-title">
              <h2 id="readerTitle">Loading papers...</h2>
              <p id="readerMeta"></p>
            </div>
            <a class="reader-open" id="readerOpen" href="#" target="_blank" rel="noopener">Open PDF</a>
          </div>
          <iframe class="reader-frame" id="readerFrame" title="Selected paper PDF"></iframe>
        </article>
      </section>
    </div>
  </main>

  <script>
    /*
      Add papers here. Store PDFs anywhere in this repo, then point `pdf`
      to that file. `thumbnail` is optional; without it, the card attempts
      to show the first PDF page as the square thumbnail.
    */
    const papers = [
      {
        title: "Example Paper",
        authors: "Author Name",
        year: "2026",
        pdf: "papers/example-paper.pdf",
        thumbnail: ""
      },
      {
        title: "Second Example Paper",
        authors: "Research Group",
        year: "2025",
        pdf: "papers/second-example-paper.pdf",
        thumbnail: ""
      }
    ];

    const grid = document.getElementById("paperGrid");
    const readerTitle = document.getElementById("readerTitle");
    const readerMeta = document.getElementById("readerMeta");
    const readerOpen = document.getElementById("readerOpen");
    const readerFrame = document.getElementById("readerFrame");

    function paperMeta(paper) {
      return [paper.authors, paper.year].filter(Boolean).join(" - ");
    }

    function selectPaper(index) {
      const paper = papers[index];
      const pdfUrl = encodeURI(paper.pdf);
      readerTitle.textContent = paper.title;
      readerMeta.textContent = paperMeta(paper);
      readerOpen.href = pdfUrl;
      readerFrame.src = `${pdfUrl}#view=FitH`;

      Array.from(grid.children).forEach((card, cardIndex) => {
        card.setAttribute("aria-current", String(cardIndex === index));
      });
    }

    function createThumbnail(paper) {
      const thumbnail = document.createElement("div");
      thumbnail.className = "paper-thumb";

      if (paper.thumbnail) {
        const image = document.createElement("img");
        image.src = paper.thumbnail;
        image.alt = "";
        thumbnail.appendChild(image);
        return thumbnail;
      }

      const preview = document.createElement("object");
      preview.type = "application/pdf";
      preview.data = `${encodeURI(paper.pdf)}#page=1&toolbar=0&navpanes=0&scrollbar=0`;

      const fallback = document.createElement("div");
      fallback.className = "paper-thumb-fallback";
      fallback.textContent = "PDF";
      preview.appendChild(fallback);
      thumbnail.appendChild(preview);

      return thumbnail;
    }

    function renderPapers() {
      grid.innerHTML = "";

      if (!papers.length) {
        readerTitle.textContent = "No papers yet";
        readerMeta.textContent = "";
        readerOpen.removeAttribute("href");
        readerFrame.removeAttribute("src");
        grid.innerHTML = '<div class="empty-state">Add paper entries in index.html.</div>';
        return;
      }

      papers.forEach((paper, index) => {
        const card = document.createElement("article");
        card.className = "paper-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.addEventListener("click", () => selectPaper(index));
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPaper(index);
          }
        });

        const info = document.createElement("div");
        info.className = "paper-card-info";

        const title = document.createElement("p");
        title.className = "paper-card-title";
        title.textContent = paper.title;

        const meta = document.createElement("p");
        meta.className = "paper-card-meta";
        meta.textContent = paperMeta(paper);

        info.append(title, meta);
        card.append(createThumbnail(paper), info);
        grid.appendChild(card);
      });

      selectPaper(0);
    }

    renderPapers();
  </script>
</body>
</html>
